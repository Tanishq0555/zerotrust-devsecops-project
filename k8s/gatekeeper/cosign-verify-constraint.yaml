apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sCosignVerify
metadata:
  name: require-cosign-signed-images
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment"]
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaces:
      - ztso-app
